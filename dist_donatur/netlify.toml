# =============================================================================
# NETLIFY PRODUCTION DEPLOYMENT CONFIGURATION
# Sistem Automasi Donasi & Transparansi Beasiswa Ikatan Alumni UPI
# =============================================================================

[build]
  publish = "."

# 1. Single Page Application (SPA) Redirects
# Memastikan seluruh request URL (termasuk query parameters kampanye WhatsApp)
# dialihkan ke index.html dengan HTTP Status 200 tanpa error 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 2. HTTP Security & Privacy Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Izinkan pemuatan Looker Studio iframe dan CDN Tailwind/Google Fonts
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' 'unsafe-eval' https: http: data: blob:; frame-src 'self' https://lookerstudio.google.com https://script.google.com;"

# 3. Cache Control Spesifik untuk config.js
# Memastikan file konfigurasi endpoint selalu di-fetch yang terbaru tanpa ter-cache peramban
[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

